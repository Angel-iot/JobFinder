# ⚠️ VERSIÓN 1 (LEGACY) · usa la API de Anthropic con pago por uso.
# Se conserva intacta para poder comparar, pero SIN cron: solo se ejecuta si
# la lanzas a mano y además existe el secret ANTHROPIC_API_KEY.
# La v2 (job-search-v2.yml) usa tu suscripción y no genera cargos de API.
name: "LEGACY v1 · Búsqueda con API de pago (manual)"

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Repetir aunque la búsqueda de hoy ya se haya hecho"
        type: boolean
        default: false

# Nunca dos búsquedas a la vez.
concurrency:
  group: daily-job-search
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Buscar, analizar, filtrar y guardar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOBFINDER_USER_ID: ${{ secrets.JOBFINDER_USER_ID }}
          INFOJOBS_CLIENT_ID: ${{ secrets.INFOJOBS_CLIENT_ID }}
          INFOJOBS_CLIENT_SECRET: ${{ secrets.INFOJOBS_CLIENT_SECRET }}
          # Opcionales (Settings → Secrets and variables → Actions → Variables)
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          CLAUDE_SEARCH_EFFORT: ${{ vars.CLAUDE_SEARCH_EFFORT }}
          CLAUDE_EVAL_EFFORT: ${{ vars.CLAUDE_EVAL_EFFORT }}
          MAX_SEARCHES_PER_BATCH: ${{ vars.MAX_SEARCHES_PER_BATCH }}
          MAX_FETCHES_PER_BATCH: ${{ vars.MAX_FETCHES_PER_BATCH }}
          FORCE_RUN: ${{ inputs.force && 'true' || 'false' }}
        run: npm run search

      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jobfinder-logs-${{ github.run_id }}
          path: worker/logs/
          retention-days: 30
          if-no-files-found: ignore
